general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 7
    color = rgb(1d2021)
}

input-field {
    monitor =
    size = 600, 100
    position = 0, 0
    halign = center
    valign = center

    outline_thickness = 2
    rounding = 2
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true

    inner_color = rgb(1d2021)
    outer_color = rgb(83a598)
    font_color = rgb(ebdbb2)
    check_color = rgb(83a598)
    fail_color = rgb(fb4934)

    fade_on_empty = false
    placeholder_text = <span foreground="##928374">Password</span>
    fail_text = <span foreground="##fb4934">Wrong password</span>
}

animations {
    enabled = true
    animation = fadeIn, 0
    animation = fadeOut, 0
    animation = inputFieldDots, 1
    animation = inputFieldFade, 1
    animation = inputFieldColors, 1
    animation = inputFieldWidth, 1
}
